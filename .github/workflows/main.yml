name: Build Mini Store Tycoon

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Searching for Android project..."

          if [ -f "settings.gradle.kts" ] && [ -d "app" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_OUTPUT"
            echo "Android project found in repository root."
            exit 0
          fi

          if [ -f "android-project/settings.gradle.kts" ] && [ -d "android-project/app" ]; then
            echo "PROJECT_DIR=android-project" >> "$GITHUB_OUTPUT"
            echo "Android project found in android-project."
            exit 0
          fi

          FOUND=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

          if [ -n "$FOUND" ]; then
            DIR=$(dirname "$FOUND")
            echo "PROJECT_DIR=$DIR" >> "$GITHUB_OUTPUT"
            echo "Android project found in $DIR"
            exit 0
          fi

          echo "ERROR: Android Gradle project was not found."
          exit 1

      - name: Create Gradle wrapper
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew

      - name: Check Gradle project
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: |
          ./gradlew tasks --all

      - name: Build APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Store-Tycoon-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
